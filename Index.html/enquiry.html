<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electrical Service Enquiries | Bright Spark</title>

<meta name="description"
content="Request electrical installation, repair and maintenance services from Bright Spark Electrical Services.">
    <meta name="description" content="Enquire about professional electrical services, installations, repairs and maintenance from Bright Spark Electrical Services.">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <h1>Bright Spark Electrical Services</h1>
    <nav>
        <a href="Index.html">Home</a>
        <a href="enquiry.html">Enquiries</a>
    </nav>
</header>

<main>
    <section id="enquiry">
        <h2>Request an Electrical Service</h2>

        <p>Complete the form below and tell us what electrical service you need.</p>

        <form id="enquiryForm">

            <label for="customerName">Full Name:</label>
            <input type="text" id="customerName" required minlength="3">

            <label for="customerEmail">Email Address:</label>
            <input type="email" id="customerEmail" required>

            <label for="service">Select a Service:</label>
            <select id="service" required>
                <option value="">Choose a service</option>
                <option value="Electrical Installation">Electrical Installation</option>
                <option value="Electrical Repairs">Electrical Repairs</option>
                <option value="Maintenance">Electrical Maintenance</option>
                <option value="Wiring">Electrical Wiring</option>
            </select>

            <label for="description">Describe Your Requirements:</label>
            <textarea id="description" rows="5" required minlength="10"></textarea>

            <button type="submit">Submit Enquiry</button>

        </form>

        <p id="enquiryResponse"></p>

    </section>
</main>

<footer>
    <p>&copy; 2026 Bright Spark Electrical Services. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
